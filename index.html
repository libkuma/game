const atkOf=b=>Math.floor(b.pages/50);
const hpOf=b=>Math.max(1,Math.min(6,Math.round(b.pages/100)));
const ALL_IDS=Object.keys(BOOKS);
const POOLS=[
  ALL_IDS.filter(id=>atkOf(BOOKS[id])<=4).concat(['blank','blank']),
  ALL_IDS.filter(id=>{const a=atkOf(BOOKS[id]);return a>=2&&a<=8;}),
  ALL_IDS.filter(id=>atkOf(BOOKS[id])>=4)
];
const FOES = ['신입 유령 사서','수석 유령 사서','금서고의 관장'];
const FOE_COL = [0xaec8ff,0xb7f0c8,0xffa0a0];
const WIN_AT = 15;
const maxInk = turn => Math.min(10,turn+2);

const LINES = {
  start:['"쉿. 여기는 도서관이네. 조용히 겨루지."','"어떤 분류의 책을 꺼내 들겠나?"'],
  play:['"훌륭한 장서로군."','"좋은 책이야. 쪽수도 두둑하고."','"흠... 그런 책을 꺼내다니."'],
  bell:['"종이 울렸군. 반납 시간이야."','"자, 책장을 넘겨 보세."'],
  enemy:['"이번엔 내 서가 차례일세."','"서가의 책들이 깨어난다."'],
  win:['"...제법이군. 새 장서를 골라 가게."','"이 서고에서 보기 드문 실력이야."'],
  lose:['"연체료는 목숨이라네..."','"다시 앉게. 아직 대출은 끝나지 않았어."']
};
const pick = a => a[Math.floor(Math.random()*a.length)];
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
let uid=0;
const mk = id => {
  const b=BOOKS[id], hp=hpOf(b);
  return {id,uid:++uid,name:b.title,author:b.author,cls:b.cls,pages:b.pages,art:b.art,
          atk:atkOf(b),hp,maxhp:hp,cost:{t:b.cls===0?'free':'ink',n:b.cls},sigils:[...b.sigils]};
};
const costTxt = c => c.cost.n===0?'무료 (0)':'🖋️ 잉크 ×'+c.cost.n;

/* =========================================================
   사운드
========================================================= */
let AC=null, muted=false;
function snd(f=220,d=.1,type='square',v=.05,slide=0){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,AC.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    g.gain.setValueAtTime(v,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
const sHit=()=>snd(160,.18,'sawtooth',.08,-100);
const sPlace=()=>snd(300,.08,'triangle',.07,120);
const sBell=()=>{snd(880,.6,'sine',.1);snd(1320,.5,'sine',.05)};
const sDie=()=>snd(120,.3,'square',.06,-80);
const sDmg=()=>snd(90,.3,'sawtooth',.1,-30);
const sFlip=()=>snd(500,.07,'triangle',.05,200);

/* =========================================================
   three.js 기본 설정
========================================================= */
const V3=THREE.Vector3;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090503);
scene.fog=new THREE.Fog(0x090503,16,38);
const camera=new THREE.PerspectiveCamera(46,1,0.1,90);
const LOOK=new V3(0,0.6,-1.2), DIR=new V3(0,7.9,10.2);
let camMul=1, mx=0, my=0, camShake=0;
function fit(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  const half=Math.tan(THREE.MathUtils.degToRad(23))*DIR.length()*camera.aspect;
  camMul=Math.max(1,5.5/half);
}
window.addEventListener('resize',fit);

/* ---------- 텍스처 도우미 ---------- */
function canvasTex(c,repeat){
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  if(repeat){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]); }
  return t;
}
function makeWood(base,dark,seams){
  const w=512,h=512,c=document.createElement('canvas'); c.width=w;c.height=h;
  const g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,w,h);
  for(let i=0;i<280;i++){
    const y=Math.random()*h; g.strokeStyle=`rgba(${dark},${Math.random()*.28})`; g.lineWidth=Math.random()*3+.5;
    g.beginPath(); g.moveTo(0,y);
    for(let x=0;x<=w;x+=32) g.lineTo(x,y+Math.sin(x*.02+i)*3+(Math.random()-.5)*1.5);
    g.stroke();
  }
  for(let i=0;i<seams;i++){ g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(0,i*h/seams,w,3); }
  return c;
}
function makeFelt(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#21402f'; g.fillRect(0,0,256,256);
  for(let i=0;i<6000;i++){ g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'120,200,150'},${Math.random()*.08})`; g.fillRect(Math.random()*256,Math.random()*256,2,2); }
  return c;
}
function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const SERIF='"Noto Serif KR","Nanum Myeongjo",Georgia,serif';
// KDC 대분류별 책 표지색
const CLS_COL=['#6e6e78','#5a4a8a','#8a6a2a','#2f5f8a','#2a7a6a','#7a5a2a','#9a3a5a','#4a6a2a','#8a2a2a','#5a3a1a'];

/* ---------- 책 카드 앞면 그리기 (3D 텍스처 + 보상 화면 공용) ---------- */
function drawFace(cv,c,enemy){
  const W=cv.width,H=cv.height,g=cv.getContext('2d');
  g.clearRect(0,0,W,H); g.save(); rr(g,0,0,W,H,28); g.clip();
  const gr=g.createLinearGradient(0,0,W,H);
  if(enemy){gr.addColorStop(0,'#d1c3a8');gr.addColorStop(1,'#8c7a63');}
  else{gr.addColorStop(0,'#f3e5ba');gr.addColorStop(1,'#cdb27b');}
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  for(let i=0;i<500;i++){ g.fillStyle=`rgba(90,60,20,${Math.random()*.07})`; g.fillRect(Math.random()*W,Math.random()*H,2,2); }
  // 책등 띠 (KDC 분류색)
  g.fillStyle=CLS_COL[c.cls]; g.fillRect(0,0,28,H);
  g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(24,0,3,H);
  g.strokeStyle='#4a3216'; g.lineWidth=8; rr(g,8,8,W-16,H-16,22); g.stroke();
  // 코스트 배지 (KDC 대분류 맨 앞자리)
  g.fillStyle='#1d120a'; g.beginPath(); g.arc(66,58,32,0,Math.PI*2); g.fill();
  g.strokeStyle='#d9b45a'; g.lineWidth=4; g.stroke();
  g.fillStyle='#ffe6a0'; g.font=`900 44px ${SERIF}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(c.cost.n,66,60);
  // KDC 분류 라벨
  g.fillStyle='#2a1c0c'; g.textAlign='right'; g.font=`bold 22px ${SERIF}`; g.fillText(`KDC ${c.cls}00`,W-26,48);
  g.font=`20px ${SERIF}`; g.fillStyle='#4a3216'; g.fillText(KDC_NAME[c.cls],W-26,74);
  // 제목 (길면 글자 크기 축소)
  g.textAlign='center'; g.fillStyle='#2a1c0c';
  let fs=34; g.font=`bold ${fs}px ${SERIF}`;
  while(g.measureText(c.name).width>W-70&&fs>16){ fs--; g.font=`bold ${fs}px ${SERIF}`; }
  g.fillText(c.name,W/2+8,118);
  g.font=`italic 19px ${SERIF}`; g.fillStyle='#5a4226'; g.fillText(c.author,W/2+8,146);
  // 그림 영역
  g.fillStyle='rgba(60,35,10,.2)'; rr(g,44,162,W-72,116,12); g.fill();
  g.strokeStyle='rgba(60,35,10,.55)'; g.lineWidth=3; rr(g,44,162,W-72,116,12); g.stroke();
  g.font=`88px ${EMOJI}`; g.fillStyle='#000'; g.fillText(c.art,W/2+8,222);

  const s=new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}

let hoverUid=null;
function layout(){
  const live=new Set();
  const put=(c,x,y,z,rx,rz,s,enemy,col)=>{
    let v=views.get(c.uid); if(!v) v=makeView(c,enemy);
    live.add(c.uid); v.tp.set(x,y,z); v.te.set(rx,0,rz); v.tq.setFromEuler(v.te); v.ts=s; v.col=col; v.enemy=enemy;
  };
  const F=-Math.PI/2;
  G.eQueue.forEach((c,l)=>c&&put(c,LX[l],.04,ZQ,F,0,.78,true,0xb8b8b8));
  G.eBoard.forEach((c,l)=>c&&put(c,LX[l],.04,ZE,F,0,1,true,0xffffff));
  G.pBoard.forEach((c,l)=>c&&put(c,LX[l],.04,ZP,F,0,1,false,0xffffff));
  const n=G.hand.length, step=Math.min(1.05,6.4/Math.max(n,1));
  G.hand.forEach((c,i)=>{
    const o=i-(n-1)/2, hov=hoverUid===c.uid, sel=G.selected===i;
    const dim=G.phase==='main'&&c.cost.n>G.ink;
    put(c,o*step,.95+(hov?.35:0)+(sel?.7:0)+i*.003,3.15-(hov?.25:0)-(sel?.35:0),F+.44+(hov||sel?.12:0),-o*.035,1.12,false,dim?0x9a9a9a:0xffffff);
  });
  views.forEach((v,id)=>{ if(!live.has(id)&&!v.dying){ scene.remove(v.group); views.delete(id); } });
}
function hintText(){
  if(!G||G.over) return '';
  if(G.busy) return '전투 중...';
  if(G.phase==='draw') return '왼쪽의 덱 또는 백지 노트 더미를 눌러 책을 한 권 뽑으세요';
  const sc=selCard();
  if(!sc) return '손패의 책을 눌러 선택하세요 · 준비되면 종을 치세요';
  if(sc.cost.n>G.ink) return `잉크가 부족합니다 (${G.ink}/${sc.cost.n})`;
  return '빈 칸을 눌러 책을 내려놓으세요';
}
function slotStates(){
  const sc=selCard();
  slotMeshes.p.forEach((m,l)=>{
    const c=G.pBoard[l]; let col=0xe6c88c, op=.26, pulse=false;
    if(sc&&G.phase==='main'&&!G.busy&&!c&&sc.cost.n<=G.ink){ col=0x7fe08a; op=.9; pulse=true; }
    m.material.color.setHex(col); m.material.opacity=op; m.userData.pulse=pulse; m.userData.base=op;
  });
}
function hud(){
  document.getElementById('ink').textContent=`🖋️ ${G.ink} / ${maxInk(G.turn)}`+(G.bonus?` (+${G.bonus})`:'');
  document.getElementById('status').innerHTML=`${FOES[run.battle]}<br>전투 ${run.battle+1}/3 · 턴 ${G.turn}`;
  document.getElementById('scaletxt').textContent=G.scale===0?`⚖️ 균형 (0/${WIN_AT})`:(G.scale>0?`⚖️ 내가 우세 +${G.scale}/${WIN_AT}`:`⚖️ 상대가 우세 ${-G.scale}/${WIN_AT}`);
  document.getElementById('hint').textContent=hintText();
  document.getElementById('bellBtn').disabled=!(G.phase==='main'&&!G.busy&&!G.over);
  const dr=G.phase==='draw'&&!G.busy&&!G.over;
  deckPile.scale.y=Math.max(.02,G.drawPile.length*.05); deckPile.visible=G.drawPile.length>0;
  deckPile.material[2].emissive.setHex(dr&&G.drawPile.length?0x553311:0x000000);
  wormPile.material[2].emissive.setHex(dr?0x554422:0x000000);
}
function sync(){
  if(!G) return;
  layout(); updateFaces(); hud(); slotStates();
  beamTarget=Math.max(-1,Math.min(1,G.scale/WIN_AT))*0.38;
}

/* =========================================================
   애니메이션 도우미
========================================================= */
function tween(ms,fn){
  return new Promise(res=>{
    const t0=performance.now();
    (function step(now){ const t=Math.min(1,(now-t0)/ms); fn(t); if(t<1) requestAnimationFrame(step); else res(); })(t0);
  });
}
function popAt(p3,txt,color='#ff6a5a'){
  const p=p3.clone().project(camera);
  const d=document.createElement('div'); d.className='pop3'; d.textContent=txt; d.style.color=color;
  d.style.left=((p.x*.5+.5)*window.innerWidth)+'px'; d.style.top=((-p.y*.5+.5)*window.innerHeight)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),950);
}
async function lunge(v,dir,amp,dx,onImpact){
  let fired=false;
  await tween(300,t=>{
    const s=Math.sin(Math.PI*t);
    v.off.set(dx*s,.5*s,dir*amp*s);
    if(!fired&&t>=.5){ fired=true; onImpact&&onImpact(); }
  });
  v.off.set(0,0,0);
}
function shake(v){
  v.front.material.color.setHex(0xff5050);
  tween(300,t=>{ v.off.x=Math.sin(t*34)*.09*(1-t); }).then(()=>{ v.off.x=0; v.front.material.color.setHex(v.col); });
}
async function dispose(v){
  v.dying=true; v.lockScale=true;
  const s0=v.group.scale.x;
  await tween(320,t=>{ v.group.scale.setScalar(s0*(1-t)); v.off.y=t*.6; });
  scene.remove(v.group); views.delete(v.card.uid);
}

/* =========================================================
   입력 (Raycaster)
========================================================= */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
const ov=document.getElementById('ov');
const blocked=()=>ov.style.display==='flex'||!G;
function pickObj(ev){
  const r=renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  const objs=[];
  views.forEach(v=>{ if(!v.dying) objs.push(...v.meshes); });
  objs.push(...slotMeshes.p,deckPile,wormPile,bellHit);
  const hits=ray.intersectObjects(objs,false);
  return hits.length?hits[0].object:null;
}
const info=document.getElementById('info');
renderer.domElement.addEventListener('pointermove',ev=>{
  mx=(ev.clientX/window.innerWidth-.5)*2; my=(ev.clientY/window.innerHeight-.5)*2;
  if(blocked()){ info.style.display='none'; return; }
  const o=pickObj(ev);
  let cursor='default', c=null, newHover=null;
  if(o){
    const ud=o.userData;
    if(ud.kind==='card'){ c=ud.view.card; if(G.hand.includes(c)){ newHover=c.uid; cursor='pointer'; } }
    else cursor='pointer';
  }
  renderer.domElement.style.cursor=cursor;
  if(newHover!==hoverUid){ hoverUid=newHover; layout(); }
  if(c){
    info.innerHTML=`<b>${c.name}</b><br>${c.author}<br>`+
      `분류: KDC ${c.cls}00 ${KDC_NAME[c.cls]} → 코스트 ${c.cost.n}<br>`+
      `📄 ${c.pages}쪽 → 공격력 ⚔️${c.atk} (쪽수÷50) · 체력 ❤️${c.hp}/${c.maxhp}`+
      (c.sigils.length?'<br>'+c.sigils.map(s=>`${SIG[s].icon} <b>${SIG[s].name}</b>: ${SIG[s].desc}`).join('<br>'):'');
    info.style.display='block';
    info.style.left=Math.min(ev.clientX+16,window.innerWidth-280)+'px'; info.style.top=Math.max(8,ev.clientY-110)+'px';
  } else info.style.display='none';
});
renderer.domElement.addEventListener('pointerdown',ev=>{
  if(blocked()||G.busy||G.over) return;
  const o=pickObj(ev); if(!o) return;
  const ud=o.userData;
  if(ud.kind==='card'){
    const c=ud.view.card, hi=G.hand.indexOf(c);
    if(hi>=0) clickHand(hi);
  }
  else if(ud.kind==='slot'&&G.phase==='main') onSlot(ud.lane);
  else if(ud.kind==='deck') drawFrom('deck');
  else if(ud.kind==='worm') drawFrom('blank');
  else if(ud.kind==='bell') ringBell();
});
document.getElementById('bellBtn').onclick=()=>ringBell();
document.getElementById('mute').onclick=function(){ muted=!muted; this.textContent=muted?'🔇':'🔊'; };
function ringBell(){ if(G&&G.phase==='main'&&!G.busy&&!G.over) endTurn(); }

function clickHand(i){
  if(G.phase!=='main') return;
  G.selected=G.selected===i?null:i; snd(400,.05,'triangle',.04); sync();
}
function drawFrom(k){
  if(!G||G.phase!=='draw'||G.busy||G.over) return;
  if(k==='deck'){ if(!G.drawPile.length) return; G.hand.push(mk(G.drawPile.pop())); }
  else G.hand.push(mk('blank'));
  G.phase='main';
  G.ink=maxInk(G.turn)+G.bonus; G.bonus=0;   // 매 턴 잉크 충전
  sFlip(); sync();
}
function onSlot(lane){
  const sc=selCard(); if(!sc) return;
  if(G.pBoard[lane]) return;
  if(sc.cost.n>G.ink){ say(`"잉크가 모자라군. (${G.ink}/${sc.cost.n})"`); return; }
  place(lane);
}
function place(lane){
  const sc=selCard();
  G.ink-=sc.cost.n;
  G.pBoard[lane]=sc; G.hand.splice(G.selected,1);
  G.selected=null; hoverUid=null;
  sPlace(); say(pick(LINES.play)); sync();
}

/* =========================================================
   전투
========================================================= */
async function endTurn(){
  G.busy=true; G.phase='combat'; G.selected=null; hoverUid=null;
  bellWob=.5; sBell(); say(pick(LINES.bell)); sync(); await sleep(500);
  for(let l=0;l<4&&!G.over;l++) await attack('p',l);
  if(G.over) return;
  say(pick(LINES.enemy)); await sleep(350);
  for(let l=0;l<4&&!G.over;l++) await attack('e',l);
  if(G.over) return;
  for(let l=0;l<4;l++) if(G.eQueue[l]&&!G.eBoard[l]){ G.eBoard[l]=G.eQueue[l]; G.eQueue[l]=null; }
  sync(); await sleep(350);
  const extra=Math.random()<[0.15,0.35,0.5][run.battle]?1:0;
  enemyQueue(1+extra); sync(); await sleep(250);
  G.turn++; G.phase='draw'; G.busy=false;
  say('"책을 한 권 뽑게."'); sync();
}
async function attack(side,lane){
  const mine=side==='p'?G.pBoard:G.eBoard, theirs=side==='p'?G.eBoard:G.pBoard, o=side==='p'?'e':'p';
  const c=mine[lane]; if(!c||c.atk<=0||G.over) return;
  const v=views.get(c.uid); if(!v) return;
  const dir=side==='p'?-1:1;
  const targets=c.sigils.includes('bifurcated')?[lane-1,lane+1].filter(x=>x>=0&&x<4):[lane];
  for(const t of targets){
    if(G.over||c.hp<=0||mine[lane]!==c) break;
    const d=theirs[t];
    const direct=!d||(c.sigils.includes('airborne')&&!d.sigils.includes('leap'));
    await lunge(v,dir,direct?1.35:.85,(LX[t]-LX[lane])*.45,()=>{
      if(direct){ damagePlayer(side,c.atk); }
      else{
        sHit(); camShake=.12;
        const dv=views.get(d.uid);
        popAt(slotPos(o,t),'-'+c.atk);
        d.hp-=c.atk; if(c.sigils.includes('deathtouch')) d.hp=0;
        if(d.sigils.includes('quills')){ c.hp-=1; popAt(slotPos(side,lane),'-1'); }
        if(dv) shake(dv); updateFaces();
      }
    });
    await reap();
  }
}
async function reap(){
  const dead=[];
  [['p',G.pBoard],['e',G.eBoard]].forEach(([s,b])=>b.forEach((c,l)=>{ if(c&&c.hp<=0) dead.push([s,l,c]); }));
  if(!dead.length) return;
  sDie();
  const jobs=dead.map(([s,l,c])=>{
    (s==='p'?G.pBoard:G.eBoard)[l]=null;
    if(s==='p'){ G.bonus++; popAt(slotPos('p',l),'+1 🖋️ (다음 턴)','#8ec8ff'); }
    const v=views.get(c.uid); return v?dispose(v):Promise.resolve();
  });
  await Promise.all(jobs); sync(); await sleep(120);
}
function damagePlayer(side,n){
  G.scale+=side==='p'?n:-n;
  sDmg(); camShake=.2; sync(); updateTokens();
  popAt(new V3(0,2.9,-5.7),(side==='p'?'+':'-')+n,side==='p'?'#9be58a':'#ff6a5a');
  if(G.scale>=WIN_AT){ G.over=true; setTimeout(winBattle,900); }
  else if(G.scale<=-WIN_AT){ G.over=true; setTimeout(loseBattle,900); }
}

/* =========================================================
   오버레이 / 진행
========================================================= */
function showOv(html){ ov.innerHTML=html; ov.style.display='flex'; info.style.display='none'; }
function hideOv(){ ov.style.display='none'; ov.innerHTML=''; }
function intro(){
  showOv(`
    <h1>📚 금서고의 카드</h1>
    <p>한밤의 대도서관, 모든 카드는 <b>책</b>이다.<br>세 명의 유령 사서를 이기면 서고 문이 열린다.</p>
    <ul class="rules">
      <li>🔢 <b>코스트</b> = 책의 <b>KDC 대분류 맨 앞자리</b> (0~9). 잉크로 지불한다.</li>
      <li>⚔️ <b>공격력</b> = <b>쪽수 50쪽당 1</b> (예: 130쪽 → 공격력 2)</li>
      <li>❤️ <b>체력</b> = 쪽수 100쪽당 1 (최소 1, 최대 6)</li>
      <li>🖋️ <b>잉크</b>는 매 턴 시작에 <b>(턴 수 + 2)</b>까지 충전된다 (최대 10). 죽은 내 책 1권당 다음 턴 +1.</li>
      <li>⚖️ 상대 본체에 준 피해가 <b>+${WIN_AT}</b>면 승리, <b>-${WIN_AT}</b>면 패배.</li>
      <li>📓 매 턴 <b>덱</b> 또는 <b>백지 노트</b>(공격 0, 무료) 더미에서 한 권을 뽑는다.</li>
      <li>🔔 종(또는 버튼)을 치면 내 책 → 상대 책 순서로 공격한다. 이기면 새 책 한 권을 덱에 넣는다.</li>
    </ul>
    <div class="kdc">KDC 대분류 · 0 총류 · 1 철학 · 2 종교 · 3 사회과학 · 4 자연과학<br>5 기술과학 · 6 예술 · 7 언어 · 8 문학 · 9 역사</div>
    <button class="btn" id="startBtn">서고에 들어선다</button>`);
  document.getElementById('startBtn').onclick=()=>{ snd(330,.25,'triangle',.08); hideOv(); newRun(); newBattle(); };
}
function winBattle(){
  say(pick(LINES.win));
  if(run.battle>=2){
    showOv(`<h1>🏆 서고 탈출</h1><p>관장 유령은 촛불을 끄고 책장 사이로 스며들었다.<br>육중한 문이 열린다. 당신은 모든 승부에서 이겼다.</p><button class="btn" id="againBtn">다시 도전</button>`);
    document.getElementById('againBtn').onclick=()=>{ hideOv(); newRun(); newBattle(); };
    return;
  }
  const ids=shuffle(ALL_IDS.filter(k=>k!=='blank')).slice(0,3);
  showOv(`<h1>승리</h1><p>서가에서 새 책 한 권을 골라 덱에 넣는다.</p><div class="rewards" id="rw"></div>`);
  const rw=document.getElementById('rw');
  ids.forEach(id=>{
    const c=mk(id), box=document.createElement('div'); box.className='rw';
    const cv=document.createElement('canvas'); cv.width=320; cv.height=448; drawFace(cv,c,false);
    const t=document.createElement('div'); t.style.marginTop='6px'; t.style.lineHeight='1.5';
    t.innerHTML=`코스트 ${c.cost.n} · ⚔️${c.atk} · ❤️${c.hp}`+(c.sigils.length?'<br>'+c.sigils.map(s=>`${SIG[s].icon} ${SIG[s].name}: ${SIG[s].desc}`).join('<br>'):'');
    box.append(cv,t);
    box.onclick=()=>{ run.deck.push(id); run.battle++; hideOv(); newBattle(); };
    rw.appendChild(box);
  });
}
function loseBattle(){
  say(pick(LINES.lose));
  showOv(`<h1>💀 촛불이 꺼졌다</h1><p>저울이 사서 쪽으로 기울었다.<br>유령이 책장을 덮고 카드를 다시 섞는다.</p><button class="btn" id="retryBtn">처음부터 다시</button>`);
  document.getElementById('retryBtn').onclick=()=>{ hideOv(); newRun(); newBattle(); };
}

/* =========================================================
   메인 루프
========================================================= */
const lblDeck=document.createElement('div'), lblWorm=document.createElement('div');
lblDeck.className=lblWorm.className='lbl';
document.getElementById('labels').append(lblDeck,lblWorm);
function placeLabel(el,p3){
  const p=p3.clone().project(camera);
  el.style.display=p.z<1?'block':'none';
  el.style.left=((p.x*.5+.5)*window.innerWidth)+'px'; el.style.top=((-p.y*.5+.5)*window.innerHeight)+'px';
}
const tmpColor=new THREE.Color();
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const k=1-Math.exp(-dt*11), t=now/1000;

  camShake*=.9;
  camera.position.set(LOOK.x+DIR.x*camMul+mx*.7+(Math.random()-.5)*camShake,
                      LOOK.y+DIR.y*camMul-my*.25+(Math.random()-.5)*camShake,
                      LOOK.z+DIR.z*camMul);
  camera.lookAt(LOOK);

  views.forEach(v=>{
    v.cp.lerp(v.tp,k);
    v.group.position.copy(v.cp).add(v.off);
    v.group.quaternion.slerp(v.tq,k);
    if(!v.lockScale){ const s=v.group.scale.x+(v.ts-v.group.scale.x)*k; v.group.scale.setScalar(s); }
    v.front.material.color.lerp(tmpColor.setHex(v.col),.25);
  });

  slotMeshes.p.forEach(m=>{ if(m.userData.pulse) m.material.opacity=(m.userData.base||.9)*(.65+.35*Math.sin(t*6)); });

  flames.forEach(f=>{
    const n=Math.sin(t*9+f.ph)*.5+Math.sin(t*23+f.ph*2)*.3;
    f.pl.intensity=1.0+n*.25; f.fl.scale.set(1+n*.12,1+n*.25,1+n*.12);
  });

  beam.rotation.z+=(beamTarget-beam.rotation.z)*Math.min(1,dt*4);
  const th=beam.rotation.z;
  panL.position.set(-1.7*Math.cos(th),2.35-1.7*Math.sin(th)-.95,0);
  panR.position.set( 1.7*Math.cos(th),2.35+1.7*Math.sin(th)-.95,0);

  ghost.position.y=-0.6+Math.sin(t*1.4)*.18; ghost.rotation.y=Math.sin(t*.6)*.15;
  gLight.intensity=1.1+Math.sin(t*3)*.2;

  bellWob*=.95; bellPivot.rotation.z=Math.sin(t*28)*bellWob;

  const pa=dustGeo.attributes.position;
  for(let i=0;i<DUST;i++){
    pa.array[i*3+1]+=dt*.12; pa.array[i*3]+=Math.sin(t*.3+i)*dt*.05;
    if(pa.array[i*3+1]>8) pa.array[i*3+1]=-1;
  }
  pa.needsUpdate=true;

  if(G&&ov.style.display!=='flex'){
    lblDeck.textContent=`덱 ${G.drawPile.length}권`; lblWorm.textContent='백지 노트 ∞';
    placeLabel(lblDeck,new V3(DECK_POS.x,.1,DECK_POS.z+.95)); placeLabel(lblWorm,new V3(WORM_POS.x,.1,WORM_POS.z+.95));
  } else { lblDeck.style.display=lblWorm.style.display='none'; }

  renderer.render(scene,camera);
}

fit();
requestAnimationFrame(loop);
intro();
</script>
